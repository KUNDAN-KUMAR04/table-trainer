<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Developer console · Table Trainer</title>
<style>
/* =====================================================================
   STYLES  (table of contents)
   1. Theme colours + base          2. Header + user menu     3. Layout, cards, forms, tabs
   4. Games and charts              5. Dialogs and sign-in    6. Profile + public page
   7. Responsive (phones/tablets)   8. Print                  9. Journey / My Map extras
   ===================================================================== */
/* ---------- 1. Theme colours + base ---------- */
:root{--bg:#f4f5fa;--card:#fff;--ink:#151b34;--mute:#5f6887;--acc:#5b3df5;--acc-t:#5b3df5;--acc-ink:#fff;--acc2:#eeeaff;--ok:#0e8f4f;--ok2:#e2f5ea;--bad:#d6363c;--bad2:#fdecec;--warn:#a85d00;--warn2:#fff1d6;--line:#e1e5f0;--soft:#eceef7;--sh:0 1px 2px rgba(21,27,52,.05),0 6px 20px rgba(21,27,52,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b2f;--ink:#eceffc;--mute:#9aa3c4;--acc:#7357ff;--acc-t:#a899ff;--acc-ink:#fff;--acc2:#272256;--ok:#38c276;--ok2:#14301f;--bad:#ff6b70;--bad2:#3a1b20;--warn:#f0a23a;--warn2:#3a2a10;--line:#2a2f4b;--soft:#1f2441;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b2f;--ink:#eceffc;--mute:#9aa3c4;--acc:#7357ff;--acc-t:#a899ff;--acc-ink:#fff;--acc2:#272256;--ok:#38c276;--ok2:#14301f;--bad:#ff6b70;--bad2:#3a1b20;--warn:#f0a23a;--warn2:#3a2a10;--line:#2a2f4b;--soft:#1f2441;--sh:none;color-scheme:dark}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h2{font-size:1.05rem;line-height:1.3;margin:20px 0 8px}
button{font:inherit;cursor:pointer;color:inherit;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{cursor:not-allowed}
select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--acc);color:var(--acc-ink);padding:8px 14px;border-radius:10px;font-weight:700}.skip:focus{left:8px}
/* ---------- 2. Header + user menu ---------- */
/* Solid colour first = safe fallback for older Android browsers that don't know color-mix(). The blur was removed:
   it repainted on every scroll and made cheap phones laggy. */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);background:color-mix(in srgb,var(--card) 94%,transparent);border-bottom:1px solid var(--line)}
.hd{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logo i{font-style:normal;background:var(--acc);color:var(--acc-ink);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:.95rem}
.sp{flex:1}
.lvl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem}
.bar{width:110px;height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.bar b{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
@media(max-width:560px){#lgo .lgt{display:none}}
#lgo{color:var(--bad,#c0392b)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:.85rem}
.ib:hover{background:var(--soft)}
/* User dropdown (opens under the name button, top right) */
.um{position:relative}
.umenu{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,88vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(21,27,52,.25);padding:8px;z-index:30}
.umh{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.umh b{display:block;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.umh small{display:block;color:var(--mute);font-size:.78rem;overflow-wrap:anywhere}
.umi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;font-size:.9rem}

.umi span{width:22px;text-align:center}
.umi.out{color:var(--bad)}
.umsep{height:1px;background:var(--line);margin:6px 0}
/* removes the 300ms tap delay on older Android phones */
button,.chip,.tab,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* Tab bar = a few main tabs + a "More" dropdown. The dropdown sits OUTSIDE the scrolling strip so it is never clipped. */
.tabw{display:flex;gap:6px;align-items:stretch;margin-bottom:16px}
.tabw .tabs{flex:1;min-width:0;margin-bottom:0}
.tabw .um{display:flex;flex:none}
.moreb{background:var(--soft);border:0;border-radius:14px;padding:0 14px;font-weight:700;color:var(--mute);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.moreb.on{color:var(--acc-t);background:var(--acc2)}
.umenu.mm3{width:min(270px,88vw);max-height:70vh;overflow:auto}
.umi.tab.on{background:var(--acc2);color:var(--acc-t)}
/* Collapsible "Choose your tables" panel (starts closed on phones) */
.fold{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;font-weight:800;font-size:1.05rem;text-align:left}
.fold small{flex:1;min-width:0;color:var(--mute);font-weight:700;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold i{font-style:normal;transition:transform .15s}
#abody{margin-top:10px}aside.shut #abody{display:none}aside.shut .fold i{transform:rotate(-90deg)}
/* "View more" buttons: long lists show 6 items on phones, the button reveals the rest */
.fm{display:none;width:100%;margin-top:10px}
@media(max-width:900px){.fm{display:block}.fold-m.shut>*:nth-child(n+7){display:none}}
.app{max-width:1320px;margin:0 auto;padding:20px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
aside{position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
aside h2{margin:0 0 10px}
label{font-size:.78rem;color:var(--mute);display:block;margin:12px 0 4px;font-weight:700}
input[type=text],input[type=number]{width:100%;padding:10px 12px;font:inherit;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);transition:border-color .15s}
input[type=text]:hover,input[type=number]:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
input:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:6px}
.chip{padding:7px 0;text-align:center;border-radius:10px;font-weight:700;font-size:.9rem;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;user-select:none}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.qk button{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:.8rem;font-weight:700}.qk button:hover{border-color:var(--acc)}
.hint{font-size:.82rem;color:var(--mute);margin-top:10px}
.tip{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--acc2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.9rem}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:4px;margin-bottom:16px;background:var(--soft);border-radius:14px;scrollbar-width:none}

.mb{font-size:1.3rem;padding:14px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;font-weight:700}

.ph div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--mute);font-size:.85rem}.ph b{display:block;font-size:1.8rem;color:var(--acc-t)}
.body{max-height:400px;overflow-y:auto;scrollbar-width:thin}

.days{display:flex;gap:6px}.days i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:800;background:var(--bg);border:1.5px solid var(--line);color:var(--mute)}

.goal{display:flex;align-items:center;gap:12px}
