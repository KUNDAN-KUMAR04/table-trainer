<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donate</title>
<style>
  :root{--bg:#f3f6f4;--ink:#14261f;--muted:#5a6b63;--card:#fff;--line:#d3ddd7;--accent:#1f6f55;--accent-ink:#fff;--soft:#e2efe8}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1a16;--ink:#e8f1ec;--muted:#9bb0a6;--card:#16251f;--line:#2a3d34;--accent:#4fbf93;--accent-ink:#06150f;--soft:#1d3329}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
  main{max-width:960px;margin:0 auto;padding:48px 20px;display:grid;gap:40px;grid-template-columns:1fr 1fr;align-items:start}
  h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin:0 0 16px;letter-spacing:-.01em}
  p{margin:0 0 14px;color:var(--muted);font-size:1.05rem;max-width:46ch}
  .impact{margin-top:24px;padding-left:16px;border-left:3px solid var(--accent)}
  .impact div{margin-bottom:10px;color:var(--ink)}
  .impact b{color:var(--accent)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:5px;border-radius:10px;margin-bottom:22px}
  .tabs button{width:auto;padding:10px;background:transparent;color:var(--ink);font-size:.95rem;font-weight:600;border-radius:7px}
  .tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
  legend{font-weight:600;margin-bottom:12px;padding:0}
  fieldset{border:0;margin:0 0 20px;padding:0}
  .amounts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .amounts input{position:absolute;opacity:0}
  .amounts label{display:block;text-align:center;padding:14px 0;border:1.5px solid var(--line);border-radius:10px;font-size:1.15rem;font-weight:600;cursor:pointer;background:var(--card)}
  .amounts input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .amounts input:focus-visible+label,button:focus-visible,.custom input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .custom{margin-top:10px;display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;background:var(--card)}
  .custom span{font-weight:600;color:var(--muted)}
  .custom input{border:0;background:transparent;color:var(--ink);font-size:1.15rem;padding:13px 8px;width:100%}
  button{width:100%;padding:16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:1.1rem;font-weight:700;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.08)}
  .note{font-size:.85rem;color:var(--muted);text-align:center;margin:12px 0 0}
  #msg{color:#b3261e;font-size:.9rem;min-height:1.3em;margin:0 0 10px}
  @media (prefers-color-scheme:dark){#msg{color:#ff9d94}}
  #upi{text-align:center;margin-top:20px;display:none}
  #qr{display:inline-block;background:#fff;padding:12px;border-radius:10px;border:1px solid var(--line)}
  .upiid{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 4px;font-weight:600;word-break:break-all}
  .upiid button{width:auto;padding:6px 12px;font-size:.85rem}
  .hide{display:none!important}
  @media (max-width:760px){main{grid-template-columns:1fr;padding:32px 16px}}
</style>
</head>
<body>
<main>
  <section>
    <h1>Help us keep going</h1>
    <p>Your gift pays for our day-to-day work. Every donation, large or small, goes straight into the project.</p>
    <div class="impact">
      <div>Donate in India with any UPI app</div>
      <div>Donate from other countries by card</div>
    </div>
  </section>

  <div class="panel">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="t-upi" aria-selected="true">India (UPI)</button>
      <button type="button" role="tab" id="t-card" aria-selected="false">Other countries</button>
    </div>

    <form id="donate" novalidate>
      <fieldset>
        <legend id="legend">Choose an amount (INR)</legend>
        <div class="amounts" id="amounts"></div>
        <div class="custom"><span id="sym">₹</span><input id="custom" type="number" min="1" step="1" inputmode="numeric" placeholder="Other amount" aria-label="Other amount"></div>
      </fieldset>
      <p id="msg" role="alert"></p>
      <button type="submit" id="btn">Pay with UPI</button>
      <p class="note" id="note"></p>
    </form>

    <div id="upi">
      <div id="qr"></div>
      <p class="note" style="margin-top:10px">Scan with any UPI app (GPay, PhonePe, Paytm, BHIM)</p>
      <div class="upiid"><span id="upiText"></span><button type="button" id="copy">Copy</button></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="var s=document.createElement('script');s.src='assets/qrcode.min.js';document.head.appendChild(s)"></script>
<script>
/* ---- SETUP ---------------------------------------------------------- */
const UPI_ID = "7382048432@jupiteraxis";
const PAYEE_NAME = "Your Name or Organisation";   // shown in the UPI app
const NOTE = "Donation";
// Card payments for other countries: Stripe Payment Links (one per amount) + one "customer chooses" link
const CARD_LINKS = {10:"https://buy.stripe.com/REPLACE_10",25:"https://buy.stripe.com/REPLACE_25",50:"https://buy.stripe.com/REPLACE_50",100:"https://buy.stripe.com/REPLACE_100"};
const CARD_CUSTOM_LINK = "https://buy.stripe.com/REPLACE_CUSTOM";
/* --------------------------------------------------------------------- */

const MODES = {
  upi:  {amounts:[100,500,1000,2500], sym:"₹", cur:"INR", def:500, legend:"Choose an amount (INR)", note:"On mobile this opens your UPI app. On a computer, scan the QR code."},
  card: {amounts:[10,25,50,100],      sym:"$", cur:"USD", def:25,  legend:"Choose an amount (USD)", note:"One-time gift. You will pay on Stripe's secure page."}
};
const $ = id => document.getElementById(id);
let mode = "upi", selected = MODES.upi.def, qr = null;

function render(){
  const m = MODES[mode];
  $("amounts").innerHTML = m.amounts.map(a =>
    `<div><input type="radio" name="amt" id="a${a}" value="${a}" ${a===selected?"checked":""}><label for="a${a}">${m.sym}${a.toLocaleString("en-IN")}</label></div>`).join("");
  $("legend").textContent = m.legend; $("sym").textContent = m.sym; $("note").textContent = m.note;
  $("custom").value = ""; $("msg").textContent = ""; $("upi").style.display = "none";
  refresh();
}
function current(){ return $("custom").value ? Number($("custom").value) : selected; }
function refresh(){
  const m = MODES[mode], v = current();
  $("btn").textContent = mode==="upi" ? (v>0 ? `Pay ${m.sym}${v} with UPI` : "Pay with UPI") : (v>0 ? `Donate ${m.sym}${v}` : "Donate");
}
function setMode(next){
  mode = next; selected = MODES[mode].def;
  $("t-upi").setAttribute("aria-selected", mode==="upi"); $("t-card").setAttribute("aria-selected", mode==="card");
  render();
}
$("t-upi").onclick = () => setMode("upi");
$("t-card").onclick = () => setMode("card");
$("amounts").addEventListener("change", e => { selected = Number(e.target.value); $("custom").value = ""; $("upi").style.display="none"; refresh(); });
$("custom").addEventListener("input", () => {
  if ($("custom").value) $("amounts").querySelectorAll("input").forEach(i => i.checked = false);
  else { selected = MODES[mode].def; const d=$("a"+selected); if(d) d.checked = true; }
  $("msg").textContent = ""; $("upi").style.display="none"; refresh();
});

function upiLink(amount){
  const p = new URLSearchParams({pa:UPI_ID, pn:PAYEE_NAME, am:amount.toFixed(2), cu:"INR", tn:NOTE});
  return "upi://pay?" + p.toString().replace(/\+/g,"%20");
}

$("donate").addEventListener("submit", e => {
  e.preventDefault();
  const amount = current();
  if (!Number.isFinite(amount) || amount < 1) { $("msg").textContent = "Enter an amount of 1 or more."; return; }
  $("msg").textContent = "";
  if (mode === "upi") {
    const link = upiLink(amount);
    $("upiText").textContent = UPI_ID;
    $("upi").style.display = "block";
    $("qr").innerHTML = ""; 
    try { qr = new QRCode($("qr"), {text:link, width:200, height:200, correctLevel:QRCode.CorrectLevel.M}); }
    catch(_) { $("qr").textContent = "QR unavailable. Use the UPI ID below."; }
    if (/Android|iPhone|iPad/i.test(navigator.userAgent)) location.href = link;
  } else {
    const url = CARD_LINKS[amount] || CARD_CUSTOM_LINK;
    if (url.includes("REPLACE")) { $("msg").textContent = "Card payments are not set up yet. Add your Stripe links in the script."; return; }
    location.href = url;
  }
});
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(UPI_ID); $("copy").textContent = "Copied"; setTimeout(()=>$("copy").textContent="Copy",1500); } catch(_){}
};
render();
</script>
</body>
</html>
