<style>

.body{max-height:400px;overflow-y:auto;scrollbar-width:thin}

<body>

<header><div class="hd">

<script>
const $=id=>document.getElementById(id);
const MODES=[["path","🧭 Journey"],["map","🗺️ My Map"],["arcade","🎮 Arcade"],["today","🎯 Today"],["lab","🧮 Math Lab"],["shoot","🔫 Shooter"],["board","🏆 Boards"],["cert","🏅 Certificates"],["learn","📖 Learn"],["chart","🔢 Chart"],["type","⌨️ Practice"],["choice","🔘 Choose"],["missing","❓ Missing"],["speed","⚡ Speed 60s"],["match","🧩 Match"],["test","📝 Test"],["dash","📈 Dashboard"],["profile","👤 Profile"],["prog","📊 Progress"]];
let mode="path",st={},weakMode=false;
const def=()=>({xp:0,ans:0,ok:0,bs:0,speed:0,tests:0,perf:0,weak:{},dh:{},ms:{},dd:{},gm:{},jr:{start:null,stg:{}},ach:{},sk:{cur:0,best:0,last:null,prot:0,h:{}}});
const norm=o=>{const p=Object.assign(def(),o||{});p.sk=Object.assign(def().sk,p.sk||{});p.weak=p.weak||{};p.dh=p.dh||{};p.ms=p.ms||{};p.ach=p.ach||{};p.dd=p.dd||{};p.jr=Object.assign({start:null,stg:{}},p.jr||{});p.jr.stg=p.jr.stg||{};p.gm=p.gm||{};return p};
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=norm(LS.get("tt_v2"));
const save=()=>persist();
try{const t=localStorage.getItem("tt_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("theme").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark";try{localStorage.setItem("tt_theme",d.dataset.theme)}catch(e){}};

/* ---------- Preferences, sound, mastery, achievements ---------- */
const PREF=Object.assign({sound:true,haptic:true,smart:true,goal:50,goalDay:0},LS.get("tt_prefs")||{});
const savePref=()=>LS.set("tt_prefs",PREF);
let AC;
function tone(f,d,t=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(.07,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function sfx(k){
  if(PREF.sound){if(k==="ok"){tone(660,.12);tone(880,.18,.09)}else if(k==="bad")tone(170,.28);else if(k==="win"){tone(523,.12);tone(659,.12,.11);tone(784,.24,.22)}}
  try{if(PREF.haptic&&navigator.vibrate)navigator.vibrate(k==="bad"?[35,45,35]:k==="win"?[20,40,20,40,60]:12)}catch(e){}
}
/* Spaced repetition (Leitner boxes). P.ms["7x8"] = [box 0-5, times seen, last day, times missed]. Facts up to 20 x 20 are tracked. */
const BOX_DAYS=[0,1,2,4,8,16],MS_MAX=20,fkey=(a,m)=>a<m?a+"x"+m:m+"x"+a;
const fact=(a,m)=>P.ms[fkey(a,m)];
const mlev=e=>!e?0:e[0]>=4?3:e[0]>=2?2:1;
function learnFact(a,m,ok,help){
  if(a>MS_MAX||m>MS_MAX)return;
  const k=fkey(a,m),e=P.ms[k]||(P.ms[k]=[0,0,0,0]);
  e[1]++;e[2]=dn();
  if(ok){if(!help)e[0]=Math.min(5,e[0]+1)}else{e[0]=0;e[3]++}
}
function record(a,m,ok,help){
  {const g=P.gm[mode]||(P.gm[mode]=[0,0]);g[0]++;if(ok)g[1]++}
  P.ans++;out("ans",1);const k=a+"x"+m;{const t=dn(),e=P.dd[t]||(P.dd[t]=[0,0]);e[0]++;if(ok)e[1]++;for(const d in P.dd)if(+d<t-60)delete P.dd[d]}
  if(ok){P.ok++;out("ok",1);if(P.weak[k]&&--P.weak[k]<=0)delete P.weak[k]}else P.weak[k]=(P.weak[k]||0)+1;
  learnFact(a,m,ok,help);
}
function smartPick(p){
  if(p.length<2)return p[0];
  const t=dn(),prev=st.cur&&fkey(st.cur.a,st.cur.m);
  const w=p.map(([a,m])=>{if(fkey(a,m)===prev)return 0;const e=fact(a,m);if(!e)return 3;return(6-e[0])*((t-e[2])>=BOX_DAYS[e[0]]?2:.5)+(e[3]?1:0)});
  let r=Math.random()*w.reduce((x,y)=>x+y,0);
  for(let i=0;i<p.length;i++){r-=w[i];if(r<=0)return p[i]}
  return p[p.length-1];
}
const mastered=()=>{let n=0;for(let a=1;a<=12;a++){let all=true;for(let m=1;m<=10&&all;m++){const e=fact(a,m);if(!e||e[0]<4)all=false}if(all)n++}return n};
const RANKS=["Rookie","Learner","Challenger","Calculator","Whiz","Master","Legend"];
const rankOf=lv=>RANKS[Math.min(RANKS.length-1,Math.floor((lv-1)/3))];
const lvOf=()=>Math.floor(tot().xp/100)+1;
const ACH=[
  ["first","🌱","First steps","Answer a question correctly",()=>P.ok>=1],
  ["a100","💯","Century","Answer 100 questions",()=>P.ans>=100],
  ["a1000","🏔️","Thousand club","Answer 1,000 questions",()=>P.ans>=1000],
  ["bs10","⚡","On a roll","Get 10 right in a row",()=>P.bs>=10],
  ["bs25","🚀","Unstoppable","Get 25 right in a row",()=>P.bs>=25],
  ["d3","🔥","Warming up","Reach a 3-day streak",()=>P.sk.best>=3],
  ["d7","📆","Full week","Reach a 7-day streak",()=>P.sk.best>=7],
  ["d30","🏆","Habit built","Reach a 30-day streak",()=>P.sk.best>=30],
  ["sp20","⏱️","Quick draw","Score 20 in a speed round",()=>P.speed>=20],
  ["sp35","🌪️","Lightning","Score 35 in a speed round",()=>P.speed>=35],
  ["t1","📝","Test taker","Finish a test",()=>P.tests>=1],
  ["t100","🎯","Flawless","Score 100% on a test of 10 or more",()=>P.perf>=1],
  ["m1","⭐","Table master","Master every fact of one table (×1 to ×10)",()=>mastered()>=1],
  ["m5","🌟","Five tables","Master five tables",()=>mastered()>=5],
  ["lv5","🎖️","Level 5","Reach level 5",()=>lvOf()>=5],
  ["lv10","👑","Level 10","Reach level 10",()=>lvOf()>=10],
  ["jr1","🧭","Pathfinder","Master a bunch on the Journey",()=>Object.values(P.jr.stg).some(d=>d.m&&!d.sk)],
  ["jr9","🗺️","Path complete","Master every bunch on the Journey",()=>JB.every((_,i)=>P.jr.stg[i]&&P.jr.stg[i].m)]
];
function checkAch(){
  const got=[];for(const[id,ic,ti,ds,fn]of ACH){if(!P.ach[id]&&fn()){P.ach[id]=Date.now();got.push(ic+" "+ti)}}
  if(got.length){sfx("win");toast("🏅 Unlocked: "+got.join(", "));save()}
}
/* Hints show the method, never the final answer (the answer is added only after a wrong try). */
function hintFor(a,m,full){
  if(mode==="missing"){const k=st.cur.k;return`Count up in ${k}s until you reach ${a*m}.`}
  const n=Math.max(a,m),k=Math.min(a,m),p=a*m;let h;
  if(k===1)h=`Anything times 1 stays the same`;
  else if(k===10)h=`Times 10 adds a zero to ${n}`;
  else if(k===2)h=`Double it: ${n} + ${n}`;
  else if(k===5)h=`Half of ${n} × 10: ${n*10} ÷ 2`;
  else if(k===9)h=`Use ten: ${n} × 10 − ${n} = ${n*10} − ${n}`;
  else if(k<=4)h=`Add ${n} up ${k} times: ${Array(k).fill(n).join(" + ")}`;
  else if(k<=8)h=`Split ${k} as 5 + ${k-5}: (${n} × 5) + (${n} × ${k-5}) = ${n*5} + ${n*(k-5)}`;
  else{const t=k-k%10,r=k%10;h=r?`Split ${k} as ${t} + ${r}: (${n} × ${t}) + (${n} × ${r}) = ${n*t} + ${n*r}`:`${k} is ${k/10} ten${k>10?"s":""}: work out ${n} × ${k/10}, then add a zero`}
  return full?h+" = "+p:h;
}

/* ---------- Dialogs, export, worksheet ---------- */
const MD=()=>$("modal");let lastFocus=null;
function openModal(html){lastFocus=document.activeElement;MD().innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="mt">${html}</div>`;MD().hidden=false;const f=MD().querySelector("input,select,button");if(f)f.focus()}
function closeModal(){MD().hidden=true;MD().innerHTML="";if(lastFocus&&lastFocus.focus)lastFocus.focus()}
MD().addEventListener("mousedown",e=>{if(e.target===MD())closeModal()});
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvOut=()=>"fact,product,times_seen,leitner_box,times_missed,last_practiced\n"+Object.entries(P.ms).sort().map(([k,e])=>{const[a,m]=k.split("x");return[a+" x "+m,a*m,e[1],e[0],e[3],new Date(e[2]*864e5).toISOString().slice(0,10)].join(",")}).join("\n");
function openSettings(){
  const th=document.documentElement.dataset.theme||"auto";
  const sw=(id,on)=>`<label class="sw" style="margin:0"><input type="checkbox" id="${id}" ${on?"checked":""}><span></span></label>`;
  openModal(`<div class="mh"><h2 id="mt">Settings</h2><button class="sm" id="mx">Close</button></div>
  <div class="sr"><div><b>Sound effects</b><small>Short tones for right and wrong answers.</small></div>${sw("s1",PREF.sound)}</div>
  <div class="sr"><div><b>Vibration</b><small>A light buzz on supported phones.</small></div>${sw("s2",PREF.haptic)}</div>
  <div class="sr"><div><b>Smart review</b><small>Ask the facts you miss or haven't seen lately more often.</small></div>${sw("s3",PREF.smart)}</div>
  <div class="sr"><div><b>Daily XP goal</b><small>Counts XP earned on this login today.</small></div><select id="s4" aria-label="Daily XP goal">${[30,50,100,200].map(n=>`<option value="${n}" ${PREF.goal===n?"selected":""}>${n} XP</option>`).join("")}</select></div>
  <div class="sr"><div><b>Appearance</b></div><div class="seg" id="s5" style="margin:0;width:210px">${["auto","light","dark"].map(x=>`<button data-t="${x}" class="${th===x?"on":""}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div></div>
  <h2 style="margin:18px 0 8px">Your data</h2><div class="two"><button class="sm" id="x1">Download CSV</button><button class="sm" id="x2">Download JSON</button></div>
  <p class="hint">The CSV lists every fact you have practiced with its Leitner box and how often you missed it.</p>
  <h2 style="margin:18px 0 8px">Keyboard shortcuts</h2>
  <div class="hint" style="margin:0;line-height:2"><kbd>1</kbd>–<kbd>4</kbd> pick an option in Choose<br><kbd>Enter</kbd> check an answer or continue<br><kbd>←</kbd> <kbd>→</kbd> move through tables in slide view<br><kbd>Esc</kbd> close this dialog</div>`);
  $("mx").onclick=closeModal;
  $("s1").onchange=e=>{PREF.sound=e.target.checked;savePref();if(PREF.sound)sfx("ok")};
  $("s2").onchange=e=>{PREF.haptic=e.target.checked;savePref();if(PREF.haptic)sfx("ok")};
  $("s3").onchange=e=>{PREF.smart=e.target.checked;savePref();$("smart").checked=PREF.smart};
  $("s4").onchange=e=>{PREF.goal=+e.target.value;PREF.goalDay=0;savePref();hud()};
  $("s5").querySelectorAll("button").forEach(b=>b.onclick=()=>{const d=document.documentElement,t=b.dataset.t;if(t==="auto"){delete d.dataset.theme;try{localStorage.removeItem("tt_theme")}catch(e){}}else{d.dataset.theme=t;try{localStorage.setItem("tt_theme",t)}catch(e){}}$("s5").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
  $("x1").onclick=()=>dl("table-trainer-facts.csv",csvOut(),"text/csv");
  $("x2").onclick=()=>dl("table-trainer-progress.json",JSON.stringify({exported:new Date().toISOString(),progress:P},null,1),"application/json");
}
$("cfg").onclick=openSettings;
function printSheet(){
  const p=pool();if(!p.length)return toast("Pick a table first.");
  const q=shuffle(p).slice(0,30);
  $("sheet").innerHTML=`<h1>Table Trainer worksheet</h1><p>Name: ______________________ &nbsp; Date: ______________</p><ol class="sq">${q.map(([a,m])=>`<li>${a} × ${m} = ________</li>`).join("")}</ol><h2>Answer key</h2><p class="key">${q.map(([a,m])=>`${a} × ${m} = ${a*m}`).join(" &nbsp;·&nbsp; ")}</p>`;
  document.body.classList.add("psheet");window.print();
}
addEventListener("afterprint",()=>document.body.classList.remove("psheet"));
addEventListener("offline",()=>toast("You're offline. Progress is saved on this device and syncs when you reconnect."));
addEventListener("online",()=>{toast("Back online. Syncing your progress…");flush();poll()});
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!MD().hidden){closeModal();return}
  if(e.ctrlKey||e.metaKey||e.altKey||!MD().hidden||!$("auth").hidden)return;
  const tag=(document.activeElement||{}).tagName||"";
  if(e.key==="Enter"&&$("cont")&&document.activeElement!==$("cont")&&!/INPUT|SELECT|TEXTAREA/.test(tag)){$("cont").click();return}
  if(/INPUT|SELECT|TEXTAREA/.test(tag))return;
  if(mode==="choice"&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll(".opts button")[+e.key-1];if(b&&!b.disabled)b.click()}

/* ---- merge windows: merges queue as edges inside an hourly epoch doc (e_<hour>). When the hour ends, every connected

function components(edges){const p={},f=x=>p[x]===undefined||p[x]===x?(p[x]=x):(p[x]=f(p[x]));
  edges.filter(g=>!g.x).forEach(g=>{const r=f(g.a),q=f(g.b);p[r]=q});
  const m={};Object.keys(p).forEach(u=>{const r=f(u);(m[r]=m[r]||[]).push(u)});
  return Object.values(m).filter(c=>c.length>1).map(c=>c.sort()).sort((a,b)=>a[0]<b[0]?-1:1)}

  const add=(d,o)=>{for(const k in d||{})o[k]=(o[k]||0)+d[k]};
  for(const a of accs){const b=a.base,ro=a.roles||allAdmin(a.logins);
    if(b){base.xp+=b.xp||0;base.ans+=b.ans||0;base.ok+=b.ok||0;add(b.dh,base.dh);
      for(const h in b.by||{}){const e=base.by[h]||(base.by[h]={m:b.by[h].m,t:b.by[h].t,xp:0,ans:0,ok:0,left:b.by[h].left});e.xp+=b.by[h].xp||0;e.ans+=b.by[h].ans||0;e.ok+=b.by[h].ok||0}}
    for(const[h,l]of Object.entries(a.logins)){if(!l.t)continue;const s=norm(l.s);base.xp+=s.xp;base.ans+=s.ans;base.ok+=s.ok;add(s.dh,base.dh);
      const e=base.by[h]||(base.by[h]={m:l.m,t:l.t,xp:0,ans:0,ok:0});e.xp+=s.xp;e.ans+=s.ans;e.ok+=s.ok;
      s.xp=s.ans=s.ok=0;s.dh={};if(!logins[h])logins[h]={...l,s};roles[h]=roles[h]==="admin"||ro[h]==="admin"?"admin":"member"}}

    tree:{u:zid,n:top.name,xp:base.xp,at:now,k:accs.map(nodeOf)},log:edges.map(g=>({a:g.na,b:g.nb,m:g.bm,at:g.at}))};
}
async function consolidate(ep){
  if(Date.now()<(ep+1)*EPOCH_MS)return;
  const F=await fbp(),eid="e_"+ep,e0=await dget(eid);if(!e0)return;
  try{await flush()}catch(e){}
  const cs=components(e0.edges);
  for(const c of cs){const key=c[0];if(e0.comps&&e0.comps[key])continue;const fresh=await newUid();
    try{await F.txn(async t=>{
      const e=await t.get(eid);if(!e||(e.comps&&e.comps[key]))return;
      const c2=components(e.edges).find(q=>q[0]===key);if(!c2)return;
      const accs=[];for(const u of c2)accs.push(await t.get(u));
      /* an ID that was deleted and reused after the edge was queued is a different guild: never merge it by mistake */
      const stale=a=>e.edges.some(g=>!g.x&&(g.a===a.uid||g.b===a.uid)&&a.created>(g.t0||g.at));
      if(accs.some(a=>!a||a.mergedInto||stale(a))){   /* something changed underneath: nothing is dropped, the merges wait in the next hour */
        const ne="e_"+(ep+1),nx=(await t.get(ne))||{ep:ep+1,status:"open",edges:[],comps:{}},add=[];
        const res=async(u,g)=>{for(let i=0;i<5;i++){const a=await t.get(u);if(a&&!a.mergedInto)return(i===0&&a.created>(g.t0||g.at))?null:u;const n=a?a.mergedInto:((await t.get("r_"+u))||{}).to;if(!n)return null;u=n}return null};
        for(const g of e.edges.filter(g=>!g.x&&c2.includes(g.a))){const a=await res(g.a,g),b=await res(g.b,g);if(a&&b&&a!==b)add.push({...g,id:rid(8),a,b,t0:Date.now()})}
        add.forEach(g=>{nx.edges.push(g);t.upd(g.a,{pend:ep+1});t.upd(g.b,{pend:ep+1})});
        t.set(ne,nx);t.upd(eid,{comps:{...(e.comps||{}),[key]:"requeued"}});return}
      /* pick the new User ID: the oldest rested ID from the pool, otherwise a freshly generated one */
      const pl=(await t.get(POOL_DOC))||{free:[]},now=Date.now(),skip=new Set();let zid=fresh,used=false;
      for(const f of pl.free.slice(0,8)){if(now-f.at<RECYCLE_AFTER_MS)break;if(await t.get(f.id)){skip.add(f.id);continue}zid=f.id;used=true;break}
      if(!used&&await t.get(zid))return;
      const Z=buildZ(accs,zid,e.edges.filter(g=>!g.x&&c2.includes(g.a)),ep);Z.recycled=used;
      const hs=Object.keys(Z.logins),ix=await Promise.all(hs.map(h=>t.get("i_"+h)));
      t.set(zid,Z);t.del("r_"+zid);
      hs.forEach((h,i)=>{const u=((ix[i]&&(ix[i].uids||[ix[i].uid]))||[]).filter(k=>!c2.includes(k));u.push(zid);t.set("i_"+h,{uids:u})});
      /* old guild docs are deleted; their IDs go back to the pool and leave a redirect to the new guild */
      accs.forEach(a=>{t.del(a.uid);t.set("r_"+a.uid,{to:zid,at:now})});
      t.set(POOL_DOC,{free:[...pl.free.filter(f=>f.id!==zid&&!skip.has(f.id)),...accs.map(a=>({id:a.uid,at:now}))].slice(-2000)});
      t.upd(eid,{comps:{...(e.comps||{}),[key]:zid}});
    })}catch(err){console.warn("consolidate",err)}}
  const e1=await dget(eid);if(e1&&e1.status!=="done"&&components(e1.edges).every(c=>e1.comps&&e1.comps[c[0]]))await dupd(eid,{status:"done"});
}
async function proposeMerge(yid){
  const F=await fbp();
  for(const u of[U.uid,yid]){const a=await dget(u);if(a&&!a.mergedInto&&a.pend&&a.pend<curEp())await consolidate(a.pend)}
  for(let k=0;k<2;k++){const ep=curEp()+k,eid="e_"+ep;   /* a merge that arrives after its hour closed waits in the next hour */
    try{await F.txn(async t=>{
      const x=await t.get(U.uid),y=await t.get(yid),e=(await t.get(eid))||{ep,status:"open",edges:[],comps:{}};
      if(!x||x.mergedInto)throw new Error("merged");if(!y||!y.logins)throw new Error("noacct");if(y.mergedInto)throw new Error("merged");
      if(y.noMerge)throw new Error("blocked");if(e.status==="done")throw new Error("closing");if(e.edges.length>=400)throw new Error("full");
      if(e.edges.some(g=>!g.x&&((g.a===x.uid&&g.b===yid)||(g.a===yid&&g.b===x.uid))))throw new Error("dup");
      e.edges.push({id:rid(8),a:x.uid,b:yid,na:x.name,nb:y.name,by:U.h,bm:U.logins[U.h].m,at:Date.now(),x:false});
      t.set(eid,e);t.upd(x.uid,{pend:ep});t.upd(yid,{pend:ep});
    });return}catch(x){if(x.message!=="closing"||k)throw x}}
}
async function cancelEdge(eid,id){

}
